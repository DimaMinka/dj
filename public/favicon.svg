<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Solar Gold Gradient matching DJ Dima Minka Brand Resonance -->
    <linearGradient id="solarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A" />
      <stop offset="35%" stop-color="#FFC043" />
      <stop offset="75%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Subtle Rim Border Gradient -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 226, 138, 0.45)" />
      <stop offset="50%" stop-color="rgba(255, 160, 0, 0.15)" />
      <stop offset="100%" stop-color="rgba(230, 81, 0, 0.3)" />
    </linearGradient>

    <!-- Warm Ambient Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FFA000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .bg-plate { fill: #0b0b0e; }
    .rim-stroke { stroke: url(#rimGlow); }
    @media (prefers-color-scheme: light) {
      .bg-plate { fill: #121318; }
    }
  </style>

  <!-- Premium Dark Glass Icon Canvas with Rounded Squircle Shape -->
  <rect class="bg-plate" width="512" height="512" rx="124" />
  <rect class="rim-stroke" x="6" y="6" width="500" height="500" rx="118" fill="none" stroke-width="6" />

